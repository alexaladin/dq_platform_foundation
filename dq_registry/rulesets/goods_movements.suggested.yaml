dataset_id: goods_movements
ruleset_version: 1
owner_team: SupplyChain
data_owner: owner@example.com
rules:
- rule_id: schema_0001
  rule_type: schema
  expectation:
    required_columns:
    - movement_id
    - material_id
    - quantity
    - movement_type
    - plant
    - movement_date
    - ts_load
    - forecast_date
  severity: high
  description: 'Deterministic schema: required columns from dataset config'
  suggested_by: dataset_config
- rule_id: freshness_0001
  rule_type: freshness
  expectation:
    ts_column: ts_load
    max_age_days: 10
  severity: medium
  description: 'Deterministic freshness: 10 days max age'
  suggested_by: dataset_config
- rule_id: U001
  rule_type: uniqueness
  severity: high
  expectation:
    column: movement_id
  suggested_by: key_detection_engine
- rule_id: C001
  rule_type: completeness
  severity: high
  expectation:
    column: movement_id
  suggested_by: key_detection_engine
- rule_id: C002
  rule_type: completeness
  severity: medium
  expectation:
    column: material_id
  suggested_by: ai_patcher
  ai_confidence: 0.95
  ai_rationale: Ensures all movement records include a material identifier, critical
    for tracking moved goods.
  ai_evidence_used: material_id completeness profile reveals a low null percentage
    (0.2%) over 500 records, making it a valuable high-coverage validation.
- rule_id: D001
  rule_type: domain
  severity: high
  expectation:
    column: plant
    allowed_values:
    - PL02
    - PL01
    - PL03
  suggested_by: ai_patcher
  ai_confidence: 0.98
  ai_rationale: Only three valid plant codes are used; restricting values minimizes
    the risk of invalid plant assignments.
  ai_evidence_used: Profiling shows plant top_values strictly restricted to three
    codes with no nulls.
- rule_id: D002
  rule_type: domain
  severity: high
  expectation:
    column: movement_type
    allowed_values:
    - RECEIPT
    - ISSUE
    - TRANSFER
    - MOVE
  suggested_by: ai_patcher
  ai_confidence: 0.99
  ai_rationale: Validates standard movement types, preventing rogue codes and supporting
    downstream analytics.
  ai_evidence_used: Profiling confirms four distinct movement_type codes populate
    the entire dataset.
- rule_id: R001
  rule_type: range
  severity: high
  expectation:
    column: quantity
    min: -5.0
    max: 24.31
  suggested_by: ai_patcher
  ai_confidence: 0.95
  ai_rationale: Constrains quantities to observed bounds, preventing negative or unexpectedly
    large values. Business context says must be non-negative, but observed values
    include negatives, so range reflects profile.
  ai_evidence_used: Quantitative profiling reveals data spans from -5.0 to 24.31;
    range rule makes outliers explicit.
- rule_id: T001
  rule_type: date_not_in_future
  severity: high
  expectation:
    column: movement_date
  suggested_by: ai_patcher
  ai_confidence: 0.99
  ai_rationale: Movement dates must not exceed today's date; future dates break operational
    integrity.
  ai_evidence_used: Business context and candidate list mark movement_date as a non-future
    field.
- rule_id: C003
  rule_type: completeness
  severity: high
  expectation:
    column: quantity
  suggested_by: ai_patcher
  ai_confidence: 0.99
  ai_rationale: Every goods movement record must specify moved quantity for accurate
    tracking.
  ai_evidence_used: Null percent is 0.0% in profiling, ensuring rule will catch any
    future omissions.
- rule_id: C004
  rule_type: completeness
  severity: high
  expectation:
    column: movement_date
  suggested_by: ai_patcher
  ai_confidence: 0.98
  ai_rationale: Movement date is critical for timelines; completeness rules ensure
    all movements are timestamped.
  ai_evidence_used: Profiling shows 0.0% nulls and business context marks movement_date
    as central.
- rule_id: D003
  rule_type: domain
  severity: medium
  expectation:
    column: ts_load
    allowed_values:
    - 2/26/2026
  suggested_by: ai_patcher
  ai_confidence: 0.9
  ai_rationale: Restricts dataset load date to profiled value, defending against unintentional
    dataset version mix.
  ai_evidence_used: Profiling top_values of ts_load shows a single date value for
    all records.
- rule_id: D004
  rule_type: domain
  severity: medium
  expectation:
    column: forecast_date
    allowed_values:
    - 2/26/2026
  suggested_by: ai_patcher
  ai_confidence: 0.9
  ai_rationale: Ensures that forecast_date matches expected batch value, preventing
    anomalies from ingestion timing.
  ai_evidence_used: Profiling top_values of forecast_date reveals uniformity across
    rows.
- rule_id: A001
  rule_type: anomaly_detection
  severity: high
  expectation:
    column: quantity
    method: non_negative
  suggested_by: ai_patcher
  ai_confidence: 0.98
  ai_rationale: Detects anomalous quantity values far from average, useful for identifying
    suspicious goods movements. Method normalized to non_negative from zscore by business
    context.
  ai_evidence_used: Profiling shows a considerable std (4.63); business context implies
    non-negative quantities, but observed negative values present. Z-score > 3 will
    highlight statistical outliers.
