datasets:
  - dataset_id: materials_master
    dataset_description: "Product dictionary with master data for materials."
    columns_description:
      material_id: "Material code; a 6-character string."
      material_name: "Material or product name."
      unit_of_measure: "Unit of measure, for example ml, g, l, kg."
      created_at: "Date when the material was added to the dictionary."
      ts_load: "Date when the dataset was refreshed by the data load process."
    source_type: csv
    source_location: data/raw/materials_master.csv
    owner_team: SupplyChain
    data_owner: owner@example.com
    sla_tier: gold
    required_columns: [ts_load]
    ts_load_column: ts_load
    freshness_max_age_days: 2

  - dataset_id: goods_movements
    dataset_description: "Goods movement journal; quantity is moved units."
    columns_description:
      movement_id: "Movement ID generated by the system."
      material_id: "Material code; a 6-character string."
      quantity: "Number of moved units. Must be non-negative. Direction is encoded by movement_type."
      movement_type: "Movement type code (RECEIPT/ISSUE/TRANSFER/MOVE)."
      plant: "Destination or processing plant code from a limited set."
      movement_date: "Date when the movement was initiated; cannot be in the future."
      ts_load: "Date when the dataset was refreshed by the data load process."
      forecast_date: "Estimated movement completion date."
    source_type: csv
    source_location: data/raw/goods_movements.csv
    owner_team: SupplyChain
    data_owner: owner@example.com
    sla_tier: gold
    required_columns: [movement_id, material_id, quantity, movement_type, plant, movement_date, ts_load, forecast_date]
    ts_load_column: ts_load
    freshness_max_age_days: 10

  - dataset_id: risk_escalations
    dataset_description: "The dataset stores risks data that shows the estimated shortage of goods at specific plant, the datetime the estimation was made, and the status of the risk assigned by the Business Team after they review it"
    columns_description:
      sourcePlant: "Plant id what has a risk calculated. 4-digits value."
      tenD: "Material/Product code; a 10-character string representing a product estimated to be in shortage"
      createdAt: "the datetime when the shortage was estimated/created"
      region: "The geografical region the sourcePlant belong to: EMEA, APAC, etc"
      var: "The estimated amount of product shortage in dollars"
      shortage: "The estimated amount of product shortage in units"
      var_lag3_diff: "The estimated amount of product shortage in dollars in 3 months"
      status: "Risk Status provided by the Business Team showing their progress: 'Pending' - needs review, 'Rejected' - the business Team reviewed the risk and the risk is not valid, 'Accepted' - the Business Team confirmed the risk and pushed it to risk mitigation team."
    source_type: delta
    source_location: catalog_eastus_amt_dev.dev_ds_poc.risk_escalations
    owner_team: SupplyChain
    data_owner: owner@example.com
    sla_tier: gold
    required_columns: [sourcePlant, tenD, createdAt, region, var, shortage, var_lag3_diff, status]
  
